version: '3.8'

services:
  # Frontend Service
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: dlh-frontend
    ports:
      - "9090:9090"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_MONITORING_URL=http://localhost:9000
    depends_on:
      - load_balancer
      - monitoring_service
    networks:
      - dlnet
    restart: unless-stopped

  # Load Balancer Service
  load_balancer:
    build:
      context: ./DLH_Project
      dockerfile: Dockerfile
    container_name: dlh-load-balancer
    ports:
      - "8000:8000"
    environment:
      - SERVICE_NAME=load_balancer
    command: python -m services.load_balancer
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - dlnet
    restart: unless-stopped

  # Monitoring Service
  monitoring_service:
    build:
      context: ./DLH_Project
      dockerfile: Dockerfile
    container_name: dlh-monitoring
    ports:
      - "9000:9000"
    environment:
      - SERVICE_NAME=monitoring_service
    command: python -m services.monitoring_service
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - dlnet
    restart: unless-stopped

  # App Server 1
  app1:
    build:
      context: ./DLH_Project
      dockerfile: Dockerfile
    container_name: dlh-app1
    ports:
      - "8001:8001"
    environment:
      - SERVER_ID=app1
      - PORT=8001
      - MONGO_URI=mongodb+srv://ganeshdandekar23_db_user:Uh4TirdCgXsqwPmL@dlh.nmdrhnl.mongodb.net/?appName=DLH
    command: python -m services.app_server
    networks:
      - dlnet
    restart: unless-stopped

  # App Server 2
  app2:
    build:
      context: ./DLH_Project
      dockerfile: Dockerfile
    container_name: dlh-app2
    ports:
      - "8002:8002"
    environment:
      - SERVER_ID=app2
      - PORT=8002
      - MONGO_URI=mongodb+srv://ganeshdandekar23_db_user:Uh4TirdCgXsqwPmL@dlh.nmdrhnl.mongodb.net/?appName=DLH
    command: python -m services.app_server
    networks:
      - dlnet
    restart: unless-stopped

  # App Server 3
  app3:
    build:
      context: ./DLH_Project
      dockerfile: Dockerfile
    container_name: dlh-app3
    ports:
      - "8003:8003"
    environment:
      - SERVER_ID=app3
      - PORT=8003
      - MONGO_URI=mongodb+srv://ganeshdandekar23_db_user:Uh4TirdCgXsqwPmL@dlh.nmdrhnl.mongodb.net/?appName=DLH
    command: python -m services.app_server
    networks:
      - dlnet
    restart: unless-stopped

  # Analytics Dashboard
  analytics_dashboard:
    build:
      context: ./DLH_Project
      dockerfile: Dockerfile
    container_name: dlh-analytics
    ports:
      - "8501:8501"
    environment:
      - SERVICE_NAME=analytics_dashboard
      - MONITORING_URL=http://monitoring_service:9000
    command: streamlit run analytics/dashboard.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      - monitoring_service
      - load_balancer
    networks:
      - dlnet
    restart: unless-stopped

networks:
  dlnet:
    driver: bridge

volumes:
  dlh-data:
    driver: local
